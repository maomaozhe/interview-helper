[project]
name = "interview-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
  "jieba>=0.42,<1",
  "numpy>=2.4,<3",
  "uvicorn>=0.34,<1",
  "pyyaml>=6,<7",
  "openai>=2.14,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
ii = "interview_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_intelligence"]

[tool.hatch.build.targets.wheel.force-include]
"config/taxonomy/v1.yaml" = "interview_intelligence/resources/config/taxonomy/v1.yaml"
"prompts/extract_question_v1.md" = "interview_intelligence/resources/prompts/extract_question_v1.md"
"prompts/extract_question_v2.md" = "interview_intelligence/resources/prompts/extract_question_v2.md"
"prompts/dedup_judge_v1.md" = "interview_intelligence/resources/prompts/dedup_judge_v1.md"
"prompts/search_plan_v1.md" = "interview_intelligence/resources/prompts/search_plan_v1.md"
"prompts/query_agent_v1.md" = "interview_intelligence/resources/prompts/query_agent_v1.md"
"prompts/query_agent_v2.md" = "interview_intelligence/resources/prompts/query_agent_v2.md"
"prompts/query_agent_v3.md" = "interview_intelligence/resources/prompts/query_agent_v3.md"
"prompts/query_agent_v4.md" = "interview_intelligence/resources/prompts/query_agent_v4.md"
"prompts/query_agent_v5.md" = "interview_intelligence/resources/prompts/query_agent_v5.md"
"prompts/query_agent_v6.md" = "interview_intelligence/resources/prompts/query_agent_v6.md"
"prompts/task_annotation_v1.md" = "interview_intelligence/resources/prompts/task_annotation_v1.md"
"prompts/task_annotation_v2.md" = "interview_intelligence/resources/prompts/task_annotation_v2.md"
"prompts/task_annotation_v3.md" = "interview_intelligence/resources/prompts/task_annotation_v3.md"
"prompts/task_annotation_v4.md" = "interview_intelligence/resources/prompts/task_annotation_v4.md"
"prompts/task_annotation_v5.md" = "interview_intelligence/resources/prompts/task_annotation_v5.md"
"prompts/task_annotation_v6.md" = "interview_intelligence/resources/prompts/task_annotation_v6.md"
"prompts/extract_question_v3.md" = "interview_intelligence/resources/prompts/extract_question_v3.md"
"prompts/extract_question_v4.md" = "interview_intelligence/resources/prompts/extract_question_v4.md"
"prompts/extract_question_v5.md" = "interview_intelligence/resources/prompts/extract_question_v5.md"
"prompts/query_agent_v7.md" = "interview_intelligence/resources/prompts/query_agent_v7.md"
"prompts/query_agent_v8.md" = "interview_intelligence/resources/prompts/query_agent_v8.md"
"prompts/query_agent_v9.md" = "interview_intelligence/resources/prompts/query_agent_v9.md"
"prompts/query_agent_v10.md" = "interview_intelligence/resources/prompts/query_agent_v10.md"
"prompts/query_agent_v11.md" = "interview_intelligence/resources/prompts/query_agent_v11.md"
"prompts/query_agent_v12.md" = "interview_intelligence/resources/prompts/query_agent_v12.md"
"prompts/query_agent_v13.md" = "interview_intelligence/resources/prompts/query_agent_v13.md"
"prompts/task_annotation_v7.md" = "interview_intelligence/resources/prompts/task_annotation_v7.md"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
