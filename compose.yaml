name: interview-intelligence

services:
  postgres:
    image: postgres:16.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview_intelligence
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://interview:localdev@postgres:5432/interview_intelligence
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CORPUS_ROOT: /corpus
      SNAPSHOT_ROOT: /app/data/snapshots
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-ark-code-latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-doubao-embedding-vision}
      JUDGE_MODEL: ${JUDGE_MODEL:-ark-code-latest}
      RERANKER_MODEL: ${RERANKER_MODEL:-ark-code-latest}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-0}
      MAX_MODEL_TOKENS: ${MAX_MODEL_TOKENS:-0}
      MODEL_MIN_INTERVAL_SECONDS: ${MODEL_MIN_INTERVAL_SECONDS:-2}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-180}
      EXTRACTION_STREAM: ${EXTRACTION_STREAM:-true}
      MODEL_LOCK_PATH: /app/runtime/model-call.lock
      LOCAL_USER_ID: local
      APP_SIGNING_KEY: ${APP_SIGNING_KEY:-local-development-only}
      API_ROOT_PATH: ${API_ROOT_PATH:-}
      QUERY_ROUTER_ENABLED: ${QUERY_ROUTER_ENABLED:-true}
      PI_AGENT_ENABLED: ${PI_AGENT_ENABLED:-true}
      PI_AGENT_URL: http://pi-agent:8787
      INTERNAL_AGENT_TOKEN: ${INTERNAL_AGENT_TOKEN:-}
      QUERY_MODEL: ${QUERY_MODEL:-ark-code-latest}
      QUERY_DEADLINE_SECONDS: ${QUERY_DEADLINE_SECONDS:-60}
      QUERY_MAX_MODEL_CALLS: ${QUERY_MAX_MODEL_CALLS:-3}
      QUERY_MAX_TOKENS: ${QUERY_MAX_TOKENS:-65536}
      TASK_FILTERS_ENABLED: ${TASK_FILTERS_ENABLED:-true}
      TASK_ANNOTATION_POLICY: ${TASK_ANNOTATION_POLICY:-VERIFIED}
      JEV_DECISION_ENABLED: ${JEV_DECISION_ENABLED:-false}
      JEV_PROVIDER: ${JEV_PROVIDER:-typesafe}
      JEV_DECISION_MODE: ${JEV_DECISION_MODE:-shadow}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai/v1}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-1.13.0}
      JEV_CONFIDENCE_THRESHOLD: ${JEV_CONFIDENCE_THRESHOLD:-0.85}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn interview_intelligence.api:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./md:/corpus:ro
      - ./data:/app/data
      - model_runtime:/app/runtime

  pi-agent:
    build:
      context: .
      dockerfile: services/pi-agent/Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_AGENT_TOKEN: ${INTERNAL_AGENT_TOKEN:-}
      AGENT_HOST_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://interview:localdev@postgres:5432/interview_intelligence
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CORPUS_ROOT: /corpus
      SNAPSHOT_ROOT: /app/data/snapshots
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-ark-code-latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-doubao-embedding-vision}
      JUDGE_MODEL: ${JUDGE_MODEL:-ark-code-latest}
      RERANKER_MODEL: ${RERANKER_MODEL:-ark-code-latest}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-0}
      MAX_MODEL_TOKENS: ${MAX_MODEL_TOKENS:-0}
      MODEL_MIN_INTERVAL_SECONDS: ${MODEL_MIN_INTERVAL_SECONDS:-2}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-180}
      EXTRACTION_STREAM: ${EXTRACTION_STREAM:-true}
      MODEL_LOCK_PATH: /app/runtime/model-call.lock
      LOCAL_USER_ID: local
      APP_SIGNING_KEY: ${APP_SIGNING_KEY:-local-development-only}
    command: ["python", "-m", "interview_intelligence.worker"]
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes:
      - ./md:/corpus:ro
      - ./data:/app/data
      - model_runtime:/app/runtime

volumes:
  postgres_data:
  elasticsearch_data:
  model_runtime:
